name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.5.2"

permissions:
  contents: write

env:
  AUTODY_RELEASE_VERSION: "1.5.2"
  AUTODY_PREVIOUS_VERSION: "1.4.4"

jobs:
  build-accept-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify immutable release identity
        shell: powershell
        run: |
          if (
            "${{ github.event_name }}" -eq "push" -and
            "${{ github.ref_name }}" -ne "v$env:AUTODY_RELEASE_VERSION"
          ) {
            throw "Release tag does not match the configured version."
          }
          if ((git rev-parse v1.4.0) -ne "c2ff5c97a5af7b53f6f0361cec70f01f96370970") {
            throw "Published v1.4.0 tag changed."
          }
          if ((git rev-parse v1.4.1) -ne "a547ff28c083a5767b4865f0c6e8ca99cf89289d") {
            throw "Published v1.4.1 tag changed."
          }
          if ((git rev-parse v1.4.3) -ne "e4fb0502f4935ffa834be6584e886a261d92488a") {
            throw "Published v1.4.3 tag changed."
          }
          if ((git rev-parse v1.4.4) -ne "23fd4811aebbcc66faa10eacd4d09788039cd5e1") {
            throw "Published v1.4.4 tag changed."
          }
      - name: Download verified v1.4.4 upgrade baseline
        shell: powershell
        run: |
          $baseline = "output\baselines\v$env:AUTODY_PREVIOUS_VERSION"
          New-Item -ItemType Directory -Force $baseline | Out-Null
          $previous = Join-Path $baseline "AutoDy-$env:AUTODY_PREVIOUS_VERSION-x64.msi"
          Invoke-WebRequest `
            -Uri "https://github.com/ACCXhub/XXhub/releases/download/v$env:AUTODY_PREVIOUS_VERSION/AutoDy-$env:AUTODY_PREVIOUS_VERSION-x64.msi" `
            -OutFile $previous -UseBasicParsing
          if ((Get-FileHash -Algorithm SHA256 $previous).Hash.ToLowerInvariant() -ne "bea7a7e7495c0137d33463f504d2999dcef250e7df7766c90eb0dbcb4a1daa10") {
            throw "v1.4.4 baseline hash mismatch"
          }
      - name: Build and accept the clean-source release
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $previous = "output\baselines\v$env:AUTODY_PREVIOUS_VERSION\AutoDy-$env:AUTODY_PREVIOUS_VERSION-x64.msi"
          .\scripts\build-release-from-clean-source.ps1 `
            -Version $env:AUTODY_RELEASE_VERSION `
            -PreviousVersion $env:AUTODY_PREVIOUS_VERSION `
            -PreviousMsiPath $previous `
            -Commit $env:GITHUB_SHA
      - name: Build and run focused MSI lifecycle diagnostic
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $previous = "output\baselines\v$env:AUTODY_PREVIOUS_VERSION\AutoDy-$env:AUTODY_PREVIOUS_VERSION-x64.msi"
          .\scripts\bootstrap-source.ps1
          .\scripts\build-msi.ps1 `
            -Version $env:AUTODY_RELEASE_VERSION `
            -Commit $env:GITHUB_SHA
          .\scripts\verify-msi-lifecycle.ps1 `
            -Version $env:AUTODY_RELEASE_VERSION `
            -PreviousVersion $env:AUTODY_PREVIOUS_VERSION `
            -ArtifactDirectory "output\release\v$env:AUTODY_RELEASE_VERSION" `
            -PreviousMsiPath $previous `
            -ReportDirectory "output\release\v$env:AUTODY_RELEASE_VERSION"
      - name: Preserve MSI lifecycle diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-lifecycle-reports-v${{ env.AUTODY_RELEASE_VERSION }}-${{ github.run_id }}
          path: |
            output/release/v${{ env.AUTODY_RELEASE_VERSION }}/msi-lifecycle-report.json
            output/release/v${{ env.AUTODY_RELEASE_VERSION }}/msi-lifecycle-report.md
          if-no-files-found: warn
          retention-days: 14
      - name: Publish only canonical guarded assets
        if: github.event_name == 'push' && success()
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            output/release/v1.5.2/AutoDy-1.5.2-x64.msi
            output/release/v1.5.2/AutoDy-1.5.2-x64.msi.sha256
            output/release/v1.5.2/AutoDy-Windows-Portable-1.5.2.zip
            output/release/v1.5.2/AutoDy-Windows-Portable-1.5.2.zip.sha256
            output/release/v1.5.2/release-manifest.json
          body_path: docs/RELEASE_NOTES.md

  verify-public-assets:
    needs: build-accept-publish
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-download all public assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = "output\public-v$env:AUTODY_RELEASE_VERSION"
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download "v$env:AUTODY_RELEASE_VERSION" --dir $download
          $names = @(Get-ChildItem $download -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @(
            "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi",
            "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi.sha256",
            "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip",
            "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip.sha256",
            "release-manifest.json"
          ) | Sort-Object
          if (Compare-Object $names $expected) { throw "Unexpected public release asset set." }
      - name: Re-verify downloaded hashes, MSI and privacy
        shell: powershell
        run: |
          $download = "output\public-v$env:AUTODY_RELEASE_VERSION"
          $reports = "output\public-v$env:AUTODY_RELEASE_VERSION-reports"
          .\scripts\verify-release-artifacts.ps1 `
            -Version $env:AUTODY_RELEASE_VERSION `
            -ArtifactDirectory $download `
            -ReportDirectory $reports
          $manifest = Get-Content -Raw (Join-Path $download 'release-manifest.json') | ConvertFrom-Json
          foreach ($artifact in $manifest.artifacts) {
            $path = Join-Path $download $artifact.file
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $artifact.sha256) {
              throw "Public manifest hash mismatch: $($artifact.file)"
            }
          }
