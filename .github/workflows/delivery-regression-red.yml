name: Delivery regression focused

on:
  push:
    branches:
      - fix/delivery-verification-regression
  pull_request:
    paths:
      - tests/test_delivery_regression.py
      - src/autody/chat.py
      - src/autody/runner.py

jobs:
  focused:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap clean source
        shell: powershell
        run: .\scripts\bootstrap-source.ps1
      - name: Run focused delivery regression tests
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_delivery_regression.py
