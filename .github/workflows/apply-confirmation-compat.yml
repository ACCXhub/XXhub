name: Apply confirmation compatibility patch

on:
  push:
    branches:
      - fix/delivery-verification-regression

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delivery-verification-regression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Apply compatibility patch
        shell: powershell
        run: python .\scripts\apply-confirmation-compat.py
      - name: Bootstrap clean source
        shell: powershell
        run: .\scripts\bootstrap-source.ps1
      - name: Run impacted Python tests
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_delivery_regression.py tests/test_chat.py
      - name: Verify patch shape
        shell: powershell
        run: git diff --check
      - name: Commit canonical source patch
        shell: powershell
        run: |
          git config user.name "ACCXhub"
          git config user.email "3375139621@qq.com"
          git add src/autody/chat.py
          git diff --cached --check
          git commit -m "fix: preserve confirmation helper compatibility"
          git push origin HEAD:fix/delivery-verification-regression
