name: Patch AutoDy 1.5.4 release docs

on:
  push:
    branches:
      - release/1.5.4-setup-exe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.5.4-setup-exe
          fetch-depth: 0
      - name: Align release-facing documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # README: converge only current release-state language.
          p = Path('README.md')
          s = p.read_text(encoding='utf-8-sig')
          replacements = {
              '- 当前源码版本线仍为 **1.5.3**，canonical runtime 以 `main` 为准；当前可用运行时已包含发送确认修复、源码安装修复和托盘启动元数据容错修复。': '- 当前源码版本线为 **1.5.4**，canonical runtime 以 `main` 为准；本版本收敛发送确认、源码安装、托盘启动修复，并新增 Setup EXE 与可见卸载程序。',
              '- 当前公开稳定安装包以 **v1.4.4** 为准。v1.5.0/v1.5.1 的失败候选标签以及 v1.5.2/v1.5.3 的退役发布身份均已移除，不再作为下载或升级来源。': '- **v1.5.4** 是当前发布版本；v1.4.4 保留为上一稳定升级基线。v1.5.0/v1.5.1 的失败候选标签以及 v1.5.2/v1.5.3 的退役发布身份均已移除。',
              '- v1.4.0、v1.4.1、v1.4.3、v1.4.4 是历史公开发布；其中 v1.4.4 是当前推荐的公开安装基线。': '- v1.4.0、v1.4.1、v1.4.3、v1.4.4 是历史公开发布；普通用户从 v1.5.4 起优先使用 `AutoDy-Setup-<version>.exe`。',
              '当前项目维护和本机实际使用以 `main` 源码直运行为主；下一次公开发布应使用新的版本身份，并重新完成安装包与公开资产验证。': '当前项目维护和本机实际使用仍以 `main` 源码直运行为主；公开分发由同一版本的 Setup EXE、MSI、Portable、SHA-256 sidecar 与 release manifest 共同组成。',
              '- standalone MSI/Portable 分发能力仍保留；正式发布时可包含固定 Python、依赖、Chromium、生产前端和内置资源。': '- Setup EXE / canonical MSI / Portable 分发能力均保留；正式发布包含固定 Python、依赖、Chromium、生产前端和内置资源。',
              '只有未来正式 Release 页面真正发布新的 MSI/Portable/checksum/manifest 并完成发布验证后，才把对应资产视为正式升级版本。': '普通用户优先下载同一 Release 的 `AutoDy-Setup-<version>.exe`；MSI 作为 canonical Windows Installer payload，同时保留给维护和直接部署场景。只有 Release 页面资产与校验完成后才视为正式升级版本。',
              '既有 MSI 新安装默认优先 `D:\\AutoDy`；D: 不可用时回退到原交互用户 `%LocalAppData%\\Programs\\AutoDy`。用户数据位于原交互用户 `%LocalAppData%\\AutoDy`，普通卸载删除程序、快捷方式和三项 Windows Tasks，但默认保留 DataRoot。': 'v1.5.4 Setup EXE 底层安装 canonical MSI；新安装默认优先 `D:\\AutoDy`，D: 不可用时回退到原交互用户 `%LocalAppData%\\Programs\\AutoDy`。安装目录和开始菜单提供 `Uninstall AutoDy.exe`；普通卸载删除程序、快捷方式和 AutoDy Windows Tasks，默认保留 `%LocalAppData%\\AutoDy`，只有用户明确选择时才删除本地数据。',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          # User manual: move the ordinary-user entry to Setup EXE and retire stale 1.5.2 wording.
          p = Path('docs/软件工程/10-安装部署与用户手册.md')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace('当前 1.5.2 代码线', '当前 1.5.4 代码线')
          s = s.replace('v1.5.2', 'v1.5.4')
          s = s.replace('- **MSI**：普通用户首选；ProgramRoot 与 DataRoot 分离，Windows Installer 维护安装/Repair/升级/卸载。', '- **Setup EXE**：普通用户首选；封装 canonical MSI，提供更直接的 Windows 安装入口。\n- **MSI**：canonical 安装 payload；ProgramRoot 与 DataRoot 分离，Windows Installer 维护安装/Repair/升级/卸载。')
          s = s.replace('正式 MSI/Portable 自带固定 Python、依赖、Chromium、生产前端和内置资源', '正式 Setup EXE/MSI/Portable 自带固定 Python、依赖、Chromium、生产前端和内置资源')
          s = s.replace('## 4. MSI 首次安装', '## 4. Setup EXE / MSI 首次安装')
          s = s.replace('1. 双击已验证 MSI，接受该次 Windows 提升。', '1. 普通用户双击同一 Release 中已校验的 `AutoDy-Setup-1.5.4.exe`；需要直接使用 Windows Installer 时也可运行同版本 MSI。接受该次 Windows 提升。')
          s = s.replace('Windows 设置或开始菜单“卸载 AutoDy”应删除：', '安装目录中的 `Uninstall AutoDy.exe`、开始菜单“卸载 AutoDy”或 Windows 设置均可进入卸载；卸载应删除：')
          p.write_text(s, encoding='utf-8', newline='\n')

          # Handoff is short enough to rewrite as the current release truth.
          Path('docs/codex/PROJECT_HANDOFF.md').write_text('''# AutoDy 项目交接

## 当前 Master

- Canonical repo：`ACCXhub/XXhub`，canonical branch：`main`。
- 当前可用运行时代码检查点：`2ee9c22e2059f8a78570e7e7c5925ab5949706d5`；1.5.4 在其上收敛安装与发布层。
- 当前源码/发布版本线：`1.5.4`。
- 上一公开稳定升级基线：`v1.4.4`。

## 当前已收敛

- 发送与发送验证：可靠 post-send confirmation、当天投递证据与重复保护保持 fail-closed。
- 源码安装：locked frontend dependencies 在 build 前安装；不完整 HKCU 注册残留可安全忽略；`install.cmd` 正确传播 PowerShell 失败退出码。
- 托盘启动：模块状态快照暂缺 `required_autody_version` 等字段时返回未就绪，不再产生伪启动失败弹窗。
- 1.5.4 分发：普通用户主入口为 `AutoDy-Setup-1.5.4.exe`，底层 canonical MSI 负责升级、Repair、rollback 与卸载；安装目录及开始菜单提供 `Uninstall AutoDy.exe`，默认保留 `%LOCALAPPDATA%\\AutoDy`。

## Release 状态

- v1.5.0/v1.5.1 失败候选以及 v1.5.2/v1.5.3 退役发布身份均已移除。
- v1.4.4 保留为上一稳定升级基线。
- v1.5.4 正式资产集合：Setup EXE、MSI、Portable、三份 SHA-256 sidecar 与 `release-manifest.json`。
- `.github/workflows/release.yml` 对 `v1.5.4` 执行 clean-source build、隐私/package 验证、发布以及公开资产回下载复核。

## 稳定指针

- 项目边界与运行时根：`AGENTS.md`。
- 安装 owner：`install.cmd`、`scripts/install.ps1`。
- 托盘启动 owner：`scripts/autody-tray.ps1`。
- Windows 分发 owner：`packaging/wix/`、`packaging/uninstall/`、`scripts/build-msi.ps1`、`scripts/build-setup-exe.ps1`。
- 发布/验证 owner：`.github/workflows/release.yml`、`scripts/build-release-from-clean-source.ps1`、`scripts/verify-release-artifacts.ps1`、`scripts/verify-msi-lifecycle.ps1`。
''', encoding='utf-8', newline='\n')

          # Correct the one stale historical status sentence without erasing feature history.
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace('- `v1.5.1` lifecycle 失败候选保留为不可变历史；当前 `v1.5.2` 仍是源码版本线，在正式 GitHub Release 发布前不作为公开稳定资产。', '- `v1.5.1` lifecycle 失败候选后来已随失败发布身份一起退役；本段保留 1.5.2 源码阶段的变更历史。')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Commit docs and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/patch-154-release-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/RELEASE_NOTES.md docs/codex/PROJECT_HANDOFF.md 'docs/软件工程/10-安装部署与用户手册.md'
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git commit -m "docs(release): align AutoDy 1.5.4 installation state"
          git push origin HEAD:release/1.5.4-setup-exe
