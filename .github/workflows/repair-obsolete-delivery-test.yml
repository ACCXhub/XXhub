name: Repair obsolete delivery test

on:
  push:
    branches:
      - fix/delivery-verification-regression
    paths:
      - .github/workflows/repair-obsolete-delivery-test.yml

permissions:
  contents: write

jobs:
  repair-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delivery-verification-regression

      - name: Align legacy delivery test with count-delta proof
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_chat.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_missing_to_sent_without_new_message_proof_never_confirms(
              page, fake_chat
          ):
              page.locator('[data-e2e="chat-input"]').evaluate(
                  """editor => editor.addEventListener('keydown', event => {
                      if (event.key !== 'Enter') return;
                      const message = document.querySelector('[data-e2e="message-list"] p:last-child');
                      message?.removeAttribute('data-message-id');
                      const marker = document.createElement('time');
                      marker.textContent = '今天 08:00';
                      document.querySelector('[data-e2e="message-list"]').append(marker);
                  })"""
              )

              result = fake_chat.send(
                  "小明",
                  "早安",
                  pre_send_audit=TodayOutgoingAudit(TodayOutgoingStatus.CONFIRMED_MISSING),
                  delivery_day=date(2026, 8, 30),
              )

              assert result.status is DeliveryStatus.CONFIRMATION_FAILED
              assert result.confirmation_provenance.value == "none"
          '''
          new = '''def test_missing_stable_identity_confirms_from_matching_outgoing_count_delta(
              page, fake_chat
          ):
              page.locator('[data-e2e="chat-input"]').evaluate(
                  """editor => editor.addEventListener('keydown', event => {
                      if (event.key !== 'Enter') return;
                      const message = document.querySelector('[data-e2e="message-list"] p:last-child');
                      message?.removeAttribute('data-message-id');
                      const marker = document.createElement('time');
                      marker.textContent = '今天 08:00';
                      document.querySelector('[data-e2e="message-list"]').append(marker);
                  })"""
              )

              result = fake_chat.send(
                  "小明",
                  "早安",
                  pre_send_audit=TodayOutgoingAudit(TodayOutgoingStatus.CONFIRMED_MISSING),
                  delivery_day=date(2026, 8, 30),
              )

              assert result.status is DeliveryStatus.CONFIRMED
              assert result.send_attempts == 1
              assert result.confirmation_provenance.value == "post_send_observed"
          '''
          if old not in text:
              raise SystemExit("legacy delivery test block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_chat.py
          git diff --cached --check
          git commit -m "test: align missing-id confirmation with count delta"
          git push origin HEAD:fix/delivery-verification-regression
