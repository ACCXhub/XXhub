name: Publish AutoDy 1.5.4 one-shot v2

on:
  push:
    branches:
      - release/1.5.4-setup-exe

permissions:
  contents: write

env:
  AUTODY_RELEASE_VERSION: "1.5.4"
  AUTODY_PREVIOUS_VERSION: "1.4.4"
  AUTODY_PREVIOUS_MSI_SHA256: "bea7a7e7495c0137d33463f504d2999dcef250e7df7766c90eb0dbcb4a1daa10"

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.5.4-setup-exe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Close one-shot workflow and fast-forward main
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-154-one-shot-v2.yml
          git add -A
          git commit -m "chore(release): finalize AutoDy 1.5.4 source"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create the final 1.5.4 source commit." }
          $finalSha = (git rev-parse HEAD).Trim()
          if ($finalSha -notmatch '^[0-9a-f]{40}$') { throw "Unable to resolve final release SHA." }
          git push origin HEAD:release/1.5.4-setup-exe
          if ($LASTEXITCODE -ne 0) { throw "Unable to update the release branch." }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Unable to fast-forward main." }
          "AUTODY_FINAL_SHA=$finalSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Final release SHA: $finalSha"

      - name: Verify v1.5.4 tag is unused
        shell: powershell
        run: |
          $tag = "v$env:AUTODY_RELEASE_VERSION"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not [string]::IsNullOrWhiteSpace(($remoteTag | Out-String).Trim())) {
            throw "$tag already exists; refusing to move or reuse it."
          }

      - name: Run focused packaging contract tests
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_setup_exe_packaging.py -q

      - name: Download verified v1.4.4 baseline
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = "output\baselines\v$env:AUTODY_PREVIOUS_VERSION"
          New-Item -ItemType Directory -Force $baseline | Out-Null
          gh release download "v$env:AUTODY_PREVIOUS_VERSION" `
            --repo ACCXhub/XXhub `
            --pattern "AutoDy-$env:AUTODY_PREVIOUS_VERSION-x64.msi" `
            --dir $baseline
          if ($LASTEXITCODE -ne 0) { throw "Unable to download v1.4.4 baseline." }
          $previous = Join-Path $baseline "AutoDy-$env:AUTODY_PREVIOUS_VERSION-x64.msi"
          $actual = (Get-FileHash -Algorithm SHA256 $previous).Hash.ToLowerInvariant()
          if ($actual -ne $env:AUTODY_PREVIOUS_MSI_SHA256) { throw "v1.4.4 baseline hash mismatch." }

      - name: Build and verify final release assets
        shell: powershell
        run: |
          $previous = "output\baselines\v$env:AUTODY_PREVIOUS_VERSION\AutoDy-$env:AUTODY_PREVIOUS_VERSION-x64.msi"
          .\scripts\build-release-from-clean-source.ps1 `
            -Version $env:AUTODY_RELEASE_VERSION `
            -PreviousVersion $env:AUTODY_PREVIOUS_VERSION `
            -PreviousMsiPath $previous `
            -Commit $env:AUTODY_FINAL_SHA

      - name: Verify canonical asset set
        shell: powershell
        run: |
          $root = "output\release\v$env:AUTODY_RELEASE_VERSION"
          $expected = @(
            "AutoDy-Setup-$env:AUTODY_RELEASE_VERSION.exe",
            "AutoDy-Setup-$env:AUTODY_RELEASE_VERSION.exe.sha256",
            "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi",
            "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi.sha256",
            "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip",
            "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip.sha256",
            "release-manifest.json"
          ) | Sort-Object
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $name) -PathType Leaf)) {
              throw "Missing final asset: $name"
            }
          }

      - name: Create verified draft Release
        id: draft_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:AUTODY_RELEASE_VERSION"
          $root = "output\release\v$env:AUTODY_RELEASE_VERSION"
          $assets = @(
            (Join-Path $root "AutoDy-Setup-$env:AUTODY_RELEASE_VERSION.exe"),
            (Join-Path $root "AutoDy-Setup-$env:AUTODY_RELEASE_VERSION.exe.sha256"),
            (Join-Path $root "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi"),
            (Join-Path $root "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi.sha256"),
            (Join-Path $root "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip"),
            (Join-Path $root "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip.sha256"),
            (Join-Path $root "release-manifest.json")
          )
          gh release create $tag @assets `
            --repo ACCXhub/XXhub `
            --target $env:AUTODY_FINAL_SHA `
            --title "AutoDy v$env:AUTODY_RELEASE_VERSION" `
            --notes-file docs/RELEASE_NOTES.md `
            --draft
          if ($LASTEXITCODE -ne 0) { throw "Unable to create v1.5.4 draft Release." }

      - name: Publish v1.5.4
        id: publish_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v$env:AUTODY_RELEASE_VERSION" --repo ACCXhub/XXhub --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish v1.5.4." }

      - name: Re-download and verify public assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = "output\public-v$env:AUTODY_RELEASE_VERSION"
          $reports = "output\public-v$env:AUTODY_RELEASE_VERSION-reports"
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download "v$env:AUTODY_RELEASE_VERSION" --repo ACCXhub/XXhub --dir $download
          if ($LASTEXITCODE -ne 0) { throw "Unable to re-download public v1.5.4 assets." }
          $expected = @(
            "AutoDy-Setup-$env:AUTODY_RELEASE_VERSION.exe",
            "AutoDy-Setup-$env:AUTODY_RELEASE_VERSION.exe.sha256",
            "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi",
            "AutoDy-$env:AUTODY_RELEASE_VERSION-x64.msi.sha256",
            "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip",
            "AutoDy-Windows-Portable-$env:AUTODY_RELEASE_VERSION.zip.sha256",
            "release-manifest.json"
          ) | Sort-Object
          $names = @(Get-ChildItem -LiteralPath $download -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object $names $expected) { throw "Unexpected public v1.5.4 asset set." }
          .\scripts\verify-release-artifacts.ps1 `
            -Version $env:AUTODY_RELEASE_VERSION `
            -ArtifactDirectory $download `
            -ReportDirectory $reports
          $manifest = Get-Content -Raw (Join-Path $download 'release-manifest.json') | ConvertFrom-Json
          if ($manifest.source_revision -ne $env:AUTODY_FINAL_SHA) { throw "Public manifest source revision mismatch." }
          foreach ($artifact in $manifest.artifacts) {
            $path = Join-Path $download $artifact.file
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $artifact.sha256) {
              throw "Public manifest hash mismatch: $($artifact.file)"
            }
          }

      - name: Remove temporary release branch
        if: success()
        shell: powershell
        run: |
          git push origin --delete release/1.5.4-setup-exe
          if ($LASTEXITCODE -ne 0) { throw "Publication passed, but temporary branch cleanup failed." }

      - name: Clean failed Release identity
        if: failure() && steps.draft_release.outcome == 'success'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:AUTODY_RELEASE_VERSION"
          cmd /c "gh release view $tag --repo ACCXhub/XXhub >nul 2>nul"
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo ACCXhub/XXhub --cleanup-tag --yes
          } else {
            $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
            if (-not [string]::IsNullOrWhiteSpace(($remoteTag | Out-String).Trim())) {
              git push origin ":refs/tags/$tag"
            }
          }
