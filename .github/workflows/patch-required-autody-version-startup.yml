name: Patch required_autody_version startup guard

on:
  push:
    branches:
      - fix/required-autody-version-startup

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/required-autody-version-startup
          fetch-depth: 0

      - name: Patch strict-mode startup health check
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/autody-tray.ps1")
          text = path.read_text(encoding="utf-8-sig")
          old = '''function Test-HealthyAutoDy($Snapshot, $Expected) {
              if (-not (Test-OwnedAutoDy $Snapshot $Expected.Core) -or $null -eq $Snapshot.Modules) { return $false }
              $module = @($Snapshot.Modules.modules | Where-Object { $_.id -eq "autody-test-center" }) | Select-Object -First 1
              return $Snapshot.Identity.version -eq $Expected.Core -and $module.bundled_version -eq $Expected.Module -and
                  $module.bundled_package.required_autody_version -eq ">=1.3.0,<2.0.0" -and $module.bundled_available
          }
          '''
          new = '''function Test-HealthyAutoDy($Snapshot, $Expected) {
              if (-not (Test-OwnedAutoDy $Snapshot $Expected.Core) -or $null -eq $Snapshot.Modules) { return $false }
              $module = @($Snapshot.Modules.modules | Where-Object { $_.id -eq "autody-test-center" }) | Select-Object -First 1
              if ($null -eq $module) { return $false }

              $bundledVersionProperty = $module.PSObject.Properties["bundled_version"]
              $bundledPackageProperty = $module.PSObject.Properties["bundled_package"]
              $bundledAvailableProperty = $module.PSObject.Properties["bundled_available"]
              if ($null -eq $bundledVersionProperty -or $null -eq $bundledPackageProperty -or $null -eq $bundledAvailableProperty) {
                  return $false
              }

              $bundledPackage = $bundledPackageProperty.Value
              if ($null -eq $bundledPackage) { return $false }
              $requiredVersionProperty = $bundledPackage.PSObject.Properties["required_autody_version"]
              if ($null -eq $requiredVersionProperty) { return $false }

              return $Snapshot.Identity.version -eq $Expected.Core -and
                  $bundledVersionProperty.Value -eq $Expected.Module -and
                  $requiredVersionProperty.Value -eq ">=1.3.0,<2.0.0" -and
                  [bool]$bundledAvailableProperty.Value
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8-sig", newline="\n")
          elif 'PSObject.Properties["required_autody_version"]' not in text:
              raise SystemExit("Expected Test-HealthyAutoDy block was not found")
          '@ | python -

      - name: Verify PowerShell syntax and startup guard
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/autody-tray.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $text = Get-Content -LiteralPath "scripts/autody-tray.ps1" -Raw
          if ($text.Contains('$module.bundled_package.required_autody_version')) {
            throw "Unsafe strict-mode property chain remains"
          }
          if (-not $text.Contains('PSObject.Properties["required_autody_version"]')) {
            throw "Safe required_autody_version guard is missing"
          }

      - name: Commit bounded startup fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/autody-tray.ps1
          git commit -m "fix: tolerate incomplete module metadata during startup"
          git push origin HEAD:fix/required-autody-version-startup
