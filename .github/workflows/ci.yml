name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap clean source
        shell: powershell
        run: .\scripts\bootstrap-source.ps1
      - name: Run Python tests
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest -q -m "not release_build"
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Parse release PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem .\scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw "$($_.Name): $($errors.Message -join '; ')" }
          }
