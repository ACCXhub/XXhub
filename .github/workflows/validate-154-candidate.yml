name: Validate AutoDy 1.5.4 candidate

on:
  push:
    branches:
      - release/1.5.4-setup-exe

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.5.4-setup-exe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run 1.5.4 packaging contract tests
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_setup_exe_packaging.py -q
      - name: Download verified v1.4.4 baseline
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = "output\baselines\v1.4.4"
          New-Item -ItemType Directory -Force $baseline | Out-Null
          gh release download v1.4.4 `
            --repo ACCXhub/XXhub `
            --pattern "AutoDy-1.4.4-x64.msi" `
            --dir $baseline
          $previous = Join-Path $baseline "AutoDy-1.4.4-x64.msi"
          if ((Get-FileHash -Algorithm SHA256 $previous).Hash.ToLowerInvariant() -ne "bea7a7e7495c0137d33463f504d2999dcef250e7df7766c90eb0dbcb4a1daa10") {
            throw "v1.4.4 baseline hash mismatch"
          }
      - name: Build and verify complete 1.5.4 candidate
        shell: powershell
        run: |
          .\scripts\build-release-from-clean-source.ps1 `
            -Version 1.5.4 `
            -PreviousVersion 1.4.4 `
            -PreviousMsiPath "output\baselines\v1.4.4\AutoDy-1.4.4-x64.msi" `
            -Commit $env:GITHUB_SHA
      - name: Dump MSI CustomAction table after build failure
        if: failure()
        shell: powershell
        run: |
          $msi = "output\release\v1.5.4\AutoDy-1.5.4-x64.msi"
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            Write-Host "MSI unavailable; nothing to inspect."
            exit 0
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path $msi).Path, 0)
          try {
            $view = $database.OpenView('SELECT `Action`,`Type`,`Source`,`Target` FROM `CustomAction` ORDER BY `Action`')
            [void]$view.Execute()
            while ($record = $view.Fetch()) {
              Write-Host ("CUSTOMACTION|{0}|{1}|{2}|{3}" -f $record.StringData(1), $record.IntegerData(2), $record.StringData(3), $record.StringData(4))
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($record)
            }
            [void]$view.Close()
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($view)
          } finally {
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($database)
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer)
          }
      - name: Verify candidate asset set
        shell: powershell
        run: |
          $root = "output\release\v1.5.4"
          $expected = @(
            "AutoDy-Setup-1.5.4.exe",
            "AutoDy-Setup-1.5.4.exe.sha256",
            "AutoDy-1.5.4-x64.msi",
            "AutoDy-1.5.4-x64.msi.sha256",
            "AutoDy-Windows-Portable-1.5.4.zip",
            "AutoDy-Windows-Portable-1.5.4.zip.sha256",
            "release-manifest.json"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $name) -PathType Leaf)) {
              throw "Missing candidate asset: $name"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDy-1.5.4-candidate
          path: |
            output/release/v1.5.4/AutoDy-Setup-1.5.4.exe
            output/release/v1.5.4/AutoDy-Setup-1.5.4.exe.sha256
            output/release/v1.5.4/AutoDy-1.5.4-x64.msi
            output/release/v1.5.4/AutoDy-1.5.4-x64.msi.sha256
            output/release/v1.5.4/AutoDy-Windows-Portable-1.5.4.zip
            output/release/v1.5.4/AutoDy-Windows-Portable-1.5.4.zip.sha256
            output/release/v1.5.4/release-manifest.json
          retention-days: 3
